<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Elim Kirche Serviceportal</title>
  <link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
  <style>{{PORTAL_CSS}}</style>
  <style>{{CONTROL_CSS}}</style>
</head>
<body>
  <a class="skip" href="#main-content">Zum Inhalt springen</a>
  <header><div class="wrap header-inner"><a class="brand" href="#home" aria-label="Elim Kirche Serviceportal – Startseite"><img class="brand-logo" data-asset="Elim_Logo_L_Mini_Marine.png" alt="" width="1154" height="224"><span class="brand-divider" aria-hidden="true"></span><span class="brand-title">Serviceportal</span></a></div></header>
  <main class="wrap" id="main-content" tabindex="-1"></main>

  </dialog>
  <footer><div class="wrap footer-inner"><a class="brand footer-brand" href="#home" aria-label="Elim Kirche Serviceportal – Startseite"><img class="brand-logo" data-asset="Elim_Logo_L_Mini_Marine.png" alt="" width="1154" height="224"><span class="brand-divider" aria-hidden="true"></span><span class="brand-title">Serviceportal</span></a><span class="prototype-note">Klickbarer Entwurf · kein E-Mail-Versand</span><a href="#admin/areas">Admin-Bereich</a></div></footer>
  <script id="prototype-images" type="application/json">{{IMAGES}}</script>
  <script>{{PORTAL_JS}}</script>

</html>
